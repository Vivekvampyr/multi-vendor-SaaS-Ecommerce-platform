{% extends "base.html" %}

{% block title %}Log In — NexusSaaS{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center px-4 py-12">
    <div class="glass-panel w-full max-w-md p-8 rounded-3xl shadow-2xl relative">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-black text-slate-900 dark:text-white">Welcome Back</h1>
            <p class="text-xs text-slate-500 dark:text-zinc-400 mt-2">Sign in to your NexusSaaS customer, vendor, or admin account</p>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-zinc-300 mb-1">Email Address</label>
                <input type="email" id="login-email" required placeholder="you@example.com" class="w-full bg-slate-100 dark:bg-zinc-900 border border-slate-300 dark:border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-slate-900 dark:text-zinc-100 placeholder-slate-400 dark:placeholder-zinc-500 focus:outline-none focus:border-slate-500 transition-colors">
            </div>

            <div>
                <div class="flex items-center justify-between mb-1">
                    <label class="block text-xs font-bold text-slate-700 dark:text-zinc-300">Password</label>
                    <button type="button" onclick="togglePasswordVisibility('login-password', 'login-pwd-icon-show', 'login-pwd-icon-hide', 'login-pwd-text')" class="flex items-center space-x-1 text-[11px] font-semibold text-slate-500 hover:text-slate-900 dark:text-zinc-400 dark:hover:text-white transition-colors cursor-pointer select-none" title="Toggle password visibility">
                        <svg id="login-pwd-icon-show" class="w-3.5 h-3.5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                        </svg>
                        <svg id="login-pwd-icon-hide" class="w-3.5 h-3.5 pointer-events-none hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"></path>
                        </svg>
                        <span id="login-pwd-text">Show</span>
                    </button>
                </div>
                <input type="password" id="login-password" required placeholder="••••••••" class="w-full bg-slate-100 dark:bg-zinc-900 border border-slate-300 dark:border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-slate-900 dark:text-zinc-100 placeholder-slate-400 dark:placeholder-zinc-500 focus:outline-none focus:border-slate-500 transition-colors">
            </div>

            <button type="submit" id="login-submit-btn" class="w-full py-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-white dark:bg-zinc-100 dark:hover:bg-white dark:text-zinc-950 font-bold text-sm shadow-sm transition-all cursor-pointer">
                Sign In
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-500 dark:text-zinc-400">
            Don't have an account? <a href="/register" class="text-slate-900 dark:text-white hover:underline font-bold">Sign Up</a>
        </div>
    </div>
</div>

<script>
function togglePasswordVisibility(inputId, showIconId, hideIconId, textId) {
    const input = document.getElementById(inputId);
    if (!input) return;
    const showIcon = document.getElementById(showIconId);
    const hideIcon = document.getElementById(hideIconId);
    const textSpan = document.getElementById(textId);

    if (input.type === "password") {
        input.type = "text";
        if (showIcon) showIcon.classList.add("hidden");
        if (hideIcon) hideIcon.classList.remove("hidden");
        if (textSpan) textSpan.textContent = "Hide";
    } else {
        input.type = "password";
        if (showIcon) showIcon.classList.remove("hidden");
        if (hideIcon) hideIcon.classList.add("hidden");
        if (textSpan) textSpan.textContent = "Show";
    }
}
async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById("login-submit-btn");
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value;

    if (/\s/.test(email)) {
        window.Nexus.showToast("Spaces are not allowed in email addresses.", "error");
        document.getElementById("login-email").focus();
        return;
    }
    if (/\s/.test(password)) {
        window.Nexus.showToast("Spaces are not allowed in passwords.", "error");
        document.getElementById("login-password").focus();
        return;
    }

    btn.disabled = true;
    btn.textContent = "Signing in...";

    try {
        const resp = await window.Nexus.apiFetch("/api/v1/auth/login", {
            method: "POST",
            body: JSON.stringify({ email, password })
        });
        const token = resp.data.access_token;
        window.Nexus.setToken(token);
        window.Nexus.showToast("Signed in successfully!", "success");

        // Redirect based on user role
        const meResp = await window.Nexus.apiFetch("/api/v1/auth/me");
        const role = meResp.data.role;
        setTimeout(() => {
            if (role === "ADMIN") window.location.href = "/admin/dashboard";
            else if (role === "VENDOR") window.location.href = "/vendor/dashboard";
            else window.location.href = "/customer/dashboard";
        }, 600);
    } catch(err) {
        window.Nexus.showToast(err.message || "Invalid credentials", "error");
        btn.disabled = false;
        btn.textContent = "Sign In";
    }
}

document.addEventListener("DOMContentLoaded", () => {
    const emailInput = document.getElementById("login-email");
    const pwdInput = document.getElementById("login-password");

    if (emailInput) {
        emailInput.addEventListener("keydown", (e) => {
            if (e.key === " ") {
                e.preventDefault();
                window.Nexus.showToast("Spaces are not allowed in email addresses.", "error");
            }
        });
    }

    if (pwdInput) {
        pwdInput.addEventListener("keydown", (e) => {
            if (e.key === " ") {
                e.preventDefault();
                window.Nexus.showToast("Spaces are not allowed in passwords.", "error");
            }
        });
    }
});
</script>
{% endblock %}
