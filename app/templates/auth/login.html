{% extends "base.html" %}

{% block title %}Log In — NexusSaaS{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center px-4 py-12">
    <div class="glass-panel w-full max-w-md p-8 rounded-3xl shadow-2xl relative">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-black text-slate-900 dark:text-white">Welcome Back</h1>
            <p class="text-xs text-slate-500 dark:text-zinc-400 mt-2">Sign in to your NexusSaaS customer, vendor, or admin account</p>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-zinc-300 mb-1">Email Address</label>
                <input type="email" id="login-email" required placeholder="you@example.com" class="w-full bg-slate-100 dark:bg-zinc-900 border border-slate-300 dark:border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-slate-900 dark:text-zinc-100 placeholder-slate-400 dark:placeholder-zinc-500 focus:outline-none focus:border-slate-500 transition-colors">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-zinc-300 mb-1">Password</label>
                <input type="password" id="login-password" required placeholder="••••••••" class="w-full bg-slate-100 dark:bg-zinc-900 border border-slate-300 dark:border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-slate-900 dark:text-zinc-100 placeholder-slate-400 dark:placeholder-zinc-500 focus:outline-none focus:border-slate-500 transition-colors">
            </div>

            <button type="submit" id="login-submit-btn" class="w-full py-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-white dark:bg-zinc-100 dark:hover:bg-white dark:text-zinc-950 font-bold text-sm shadow-sm transition-all cursor-pointer">
                Sign In
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-500 dark:text-zinc-400">
            Don't have an account? <a href="/register" class="text-slate-900 dark:text-white hover:underline font-bold">Sign Up</a>
        </div>
    </div>
</div>

<script>
async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById("login-submit-btn");
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value;

    btn.disabled = true;
    btn.textContent = "Signing in...";

    try {
        const resp = await window.Nexus.apiFetch("/api/v1/auth/login", {
            method: "POST",
            body: JSON.stringify({ email, password })
        });
        const token = resp.data.access_token;
        window.Nexus.setToken(token);
        window.Nexus.showToast("Signed in successfully!", "success");

        // Redirect based on user role
        const meResp = await window.Nexus.apiFetch("/api/v1/auth/me");
        const role = meResp.data.role;
        setTimeout(() => {
            if (role === "ADMIN") window.location.href = "/admin/dashboard";
            else if (role === "VENDOR") window.location.href = "/vendor/dashboard";
            else window.location.href = "/customer/dashboard";
        }, 600);
    } catch(err) {
        window.Nexus.showToast(err.message || "Invalid credentials", "error");
        btn.disabled = false;
        btn.textContent = "Sign In";
    }
}
</script>
{% endblock %}
