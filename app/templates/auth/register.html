{% extends "base.html" %}

{% block title %}Sign Up — NexusSaaS{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center px-4 py-12">
    <div class="glass-panel w-full max-w-md p-8 rounded-3xl border border-slate-800 shadow-2xl relative">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black text-white">Create Account</h1>
            <p class="text-xs text-slate-400 mt-1">Join NexusSaaS as a Customer or Verified Store Merchant</p>
        </div>

        <!-- Role Selector Tabs -->
        <div class="grid grid-cols-2 gap-2 p-1 bg-slate-900/80 rounded-2xl border border-slate-800 mb-6">
            <button type="button" id="role-cust-btn" onclick="selectRole('CUSTOMER')" class="py-2 text-xs font-bold rounded-xl bg-indigo-600 text-white transition-all">
                🛍️ Shopper
            </button>
            <button type="button" id="role-vend-btn" onclick="selectRole('VENDOR')" class="py-2 text-xs font-bold rounded-xl text-slate-400 hover:text-white transition-all">
                🏪 Merchant / Vendor
            </button>
        </div>

        <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4">
            <input type="hidden" id="reg-role" value="CUSTOMER">

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Full Legal Name</label>
                <input type="text" id="reg-name" required placeholder="John Doe" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Email Address</label>
                <input type="email" id="reg-email" required placeholder="you@example.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
                <input type="password" id="reg-password" required minlength="8" placeholder="At least 8 characters" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors">
            </div>

            <button type="submit" id="reg-submit-btn" class="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold text-sm shadow-lg shadow-indigo-500/30 transition-all">
                Create Account
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-400">
            Already have an account? <a href="/login" class="text-indigo-400 hover:text-indigo-300 font-semibold">Log In</a>
        </div>
    </div>
</div>

<script>
function selectRole(role) {
    document.getElementById("reg-role").value = role;
    const custBtn = document.getElementById("role-cust-btn");
    const vendBtn = document.getElementById("role-vend-btn");
    if (role === "CUSTOMER") {
        custBtn.className = "py-2 text-xs font-bold rounded-xl bg-indigo-600 text-white transition-all";
        vendBtn.className = "py-2 text-xs font-bold rounded-xl text-slate-400 hover:text-white transition-all";
    } else {
        vendBtn.className = "py-2 text-xs font-bold rounded-xl bg-indigo-600 text-white transition-all";
        custBtn.className = "py-2 text-xs font-bold rounded-xl text-slate-400 hover:text-white transition-all";
    }
}

async function handleRegister(e) {
    e.preventDefault();
    const btn = document.getElementById("reg-submit-btn");
    const fullName = document.getElementById("reg-name").value.trim();
    const email = document.getElementById("reg-email").value.trim();
    const password = document.getElementById("reg-password").value;
    const role = document.getElementById("reg-role").value;

    btn.disabled = true;
    btn.textContent = "Creating account...";

    try {
        await window.Nexus.apiFetch("/api/v1/auth/register", {
            method: "POST",
            body: JSON.stringify({ full_name: fullName, email, password, role })
        });
        window.Nexus.showToast("Account created! Logging in...", "success");

        // Auto login
        const loginResp = await window.Nexus.apiFetch("/api/v1/auth/login", {
            method: "POST",
            body: JSON.stringify({ email, password })
        });
        window.Nexus.setToken(loginResp.data.access_token);

        setTimeout(() => {
            if (role === "VENDOR") window.location.href = "/vendor/dashboard";
            else window.location.href = "/customer/dashboard";
        }, 600);
    } catch(err) {
        window.Nexus.showToast(err.message || "Registration failed", "error");
        btn.disabled = false;
        btn.textContent = "Create Account";
    }
}

document.addEventListener("DOMContentLoaded", () => {
    const params = new URLSearchParams(window.location.search);
    if (params.get("role") === "VENDOR") selectRole("VENDOR");
});
</script>
{% endblock %}
