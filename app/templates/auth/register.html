{% extends "base.html" %}

{% block title %}Sign Up — NexusSaaS{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center px-4 py-12">
    <div class="glass-panel w-full max-w-md p-8 rounded-3xl shadow-2xl relative">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black text-slate-900 dark:text-white">Create Account</h1>
            <p class="text-xs text-slate-500 dark:text-zinc-400 mt-1">Join NexusSaaS as a Customer or Verified Store Merchant</p>
        </div>

        <!-- Role Selector Tabs -->
        <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100 dark:bg-zinc-900 rounded-2xl border border-slate-200 dark:border-zinc-800 mb-6">
            <button type="button" id="role-cust-btn" onclick="selectRole('CUSTOMER')" class="py-2 text-xs font-bold rounded-xl bg-slate-900 text-white dark:bg-zinc-100 dark:text-zinc-950 transition-all shadow-sm">
                Shopper
            </button>
            <button type="button" id="role-vend-btn" onclick="selectRole('VENDOR')" class="py-2 text-xs font-medium rounded-xl text-slate-600 dark:text-zinc-400 hover:text-slate-950 dark:hover:text-white transition-all">
                Merchant / Vendor
            </button>
        </div>

        <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4">
            <input type="hidden" id="reg-role" value="CUSTOMER">

            <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-zinc-300 mb-1">Full Legal Name</label>
                <input type="text" id="reg-name" required placeholder="John Doe" class="w-full bg-slate-100 dark:bg-zinc-900 border border-slate-300 dark:border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-slate-900 dark:text-zinc-100 placeholder-slate-400 dark:placeholder-zinc-500 focus:outline-none focus:border-slate-500 transition-colors">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-zinc-300 mb-1">Email Address</label>
                <input type="email" id="reg-email" required placeholder="you@example.com" class="w-full bg-slate-100 dark:bg-zinc-900 border border-slate-300 dark:border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-slate-900 dark:text-zinc-100 placeholder-slate-400 dark:placeholder-zinc-500 focus:outline-none focus:border-slate-500 transition-colors">
            </div>

            <div>
                <div class="flex items-center justify-between mb-1">
                    <label class="block text-xs font-bold text-slate-700 dark:text-zinc-300">Password</label>
                    <button type="button" onclick="togglePasswordVisibility('reg-password', 'reg-pwd-toggle-text')" class="text-[11px] font-semibold text-slate-500 hover:text-slate-900 dark:text-zinc-400 dark:hover:text-white transition-colors cursor-pointer select-none">
                        <span id="reg-pwd-toggle-text">Show</span>
                    </button>
                </div>
                <input type="password" id="reg-password" required minlength="8" oninput="updatePasswordStrength(this.value)" placeholder="At least 8 characters" class="w-full bg-slate-100 dark:bg-zinc-900 border border-slate-300 dark:border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-slate-900 dark:text-zinc-100 placeholder-slate-400 dark:placeholder-zinc-500 focus:outline-none focus:border-slate-500 transition-colors">

                <!-- Password Strength Indicator Component -->
                <div id="password-strength-container" class="mt-2 space-y-1.5 hidden transition-all duration-300">
                    <!-- 3-Segment Progress Bar -->
                    <div class="grid grid-cols-3 gap-1.5 h-1.5 w-full">
                        <div id="pwd-bar-1" class="h-full rounded-full bg-slate-200 dark:bg-zinc-800 transition-all duration-300"></div>
                        <div id="pwd-bar-2" class="h-full rounded-full bg-slate-200 dark:bg-zinc-800 transition-all duration-300"></div>
                        <div id="pwd-bar-3" class="h-full rounded-full bg-slate-200 dark:bg-zinc-800 transition-all duration-300"></div>
                    </div>

                    <!-- Strength Status & Dynamic Hint -->
                    <div class="flex items-center justify-between text-[11px] pt-0.5">
                        <div class="flex items-center space-x-1.5">
                            <span class="text-slate-500 dark:text-zinc-400">Strength:</span>
                            <span id="pwd-strength-label" class="font-bold text-rose-500 transition-colors">Weak</span>
                        </div>
                        <span id="pwd-strength-hint" class="text-slate-400 dark:text-zinc-500 text-[10px]">Min. 8 characters</span>
                    </div>

                    <!-- Live Criteria Checklist Badges -->
                    <div class="flex flex-wrap gap-1 pt-1 text-[10px]">
                        <span id="req-len" class="px-2 py-0.5 rounded-md bg-slate-200/70 dark:bg-zinc-800/70 text-slate-500 dark:text-zinc-400 border border-transparent transition-all font-medium flex items-center space-x-1">
                            <span class="req-icon text-[9px] font-bold">•</span> <span>8+ chars</span>
                        </span>
                        <span id="req-case" class="px-2 py-0.5 rounded-md bg-slate-200/70 dark:bg-zinc-800/70 text-slate-500 dark:text-zinc-400 border border-transparent transition-all font-medium flex items-center space-x-1">
                            <span class="req-icon text-[9px] font-bold">•</span> <span>Upper & Lower</span>
                        </span>
                        <span id="req-num" class="px-2 py-0.5 rounded-md bg-slate-200/70 dark:bg-zinc-800/70 text-slate-500 dark:text-zinc-400 border border-transparent transition-all font-medium flex items-center space-x-1">
                            <span class="req-icon text-[9px] font-bold">•</span> <span>Numbers</span>
                        </span>
                        <span id="req-sym" class="px-2 py-0.5 rounded-md bg-slate-200/70 dark:bg-zinc-800/70 text-slate-500 dark:text-zinc-400 border border-transparent transition-all font-medium flex items-center space-x-1">
                            <span class="req-icon text-[9px] font-bold">•</span> <span>Symbols</span>
                        </span>
                    </div>
                </div>
            </div>

            <button type="submit" id="reg-submit-btn" class="w-full py-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-white dark:bg-zinc-100 dark:hover:bg-white dark:text-zinc-950 font-bold text-sm shadow-sm transition-all cursor-pointer">
                Create Account
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-500 dark:text-zinc-400">
            Already have an account? <a href="/login" class="text-slate-900 dark:text-white hover:underline font-bold">Log In</a>
        </div>
    </div>
</div>

<script>
function selectRole(role) {
    document.getElementById("reg-role").value = role;
    const custBtn = document.getElementById("role-cust-btn");
    const vendBtn = document.getElementById("role-vend-btn");
    if (role === "CUSTOMER") {
        custBtn.className = "py-2 text-xs font-bold rounded-xl bg-slate-900 text-white dark:bg-zinc-100 dark:text-zinc-950 transition-all shadow-sm";
        vendBtn.className = "py-2 text-xs font-medium rounded-xl text-slate-600 dark:text-zinc-400 hover:text-slate-950 dark:hover:text-white transition-all";
    } else {
        vendBtn.className = "py-2 text-xs font-bold rounded-xl bg-slate-900 text-white dark:bg-zinc-100 dark:text-zinc-950 transition-all shadow-sm";
        custBtn.className = "py-2 text-xs font-medium rounded-xl text-slate-600 dark:text-zinc-400 hover:text-slate-950 dark:hover:text-white transition-all";
    }
}

function togglePasswordVisibility(inputId, toggleTextId) {
    const input = document.getElementById(inputId);
    const toggleText = document.getElementById(toggleTextId);
    if (!input) return;
    if (input.type === "password") {
        input.type = "text";
        if (toggleText) toggleText.textContent = "Hide";
    } else {
        input.type = "password";
        if (toggleText) toggleText.textContent = "Show";
    }
}

function updatePasswordStrength(password) {
    const container = document.getElementById("password-strength-container");
    const bar1 = document.getElementById("pwd-bar-1");
    const bar2 = document.getElementById("pwd-bar-2");
    const bar3 = document.getElementById("pwd-bar-3");
    const label = document.getElementById("pwd-strength-label");
    const hint = document.getElementById("pwd-strength-hint");

    const reqLen = document.getElementById("req-len");
    const reqCase = document.getElementById("req-case");
    const reqNum = document.getElementById("req-num");
    const reqSym = document.getElementById("req-sym");

    if (!password || password.length === 0) {
        container.classList.add("hidden");
        return;
    }
    container.classList.remove("hidden");

    // Check individual criteria
    const hasLength = password.length >= 8;
    const hasLongLength = password.length >= 10;
    const hasLower = /[a-z]/.test(password);
    const hasUpper = /[A-Z]/.test(password);
    const hasMixedCase = hasLower && hasUpper;
    const hasNumber = /[0-9]/.test(password);
    const hasSpecial = /[^A-Za-z0-9]/.test(password);

    // Update checklist pills
    updateReqPill(reqLen, hasLength);
    updateReqPill(reqCase, hasMixedCase);
    updateReqPill(reqNum, hasNumber);
    updateReqPill(reqSym, hasSpecial);

    // Calculate score
    let score = 0;
    if (hasLength) score++;
    if (hasLongLength) score++;
    if (hasMixedCase) score++;
    if (hasNumber) score++;
    if (hasSpecial) score++;

    // Reset bar styles
    const inactiveClass = "bg-slate-200 dark:bg-zinc-800";
    bar1.className = `h-full rounded-full transition-all duration-300 ${inactiveClass}`;
    bar2.className = `h-full rounded-full transition-all duration-300 ${inactiveClass}`;
    bar3.className = `h-full rounded-full transition-all duration-300 ${inactiveClass}`;

    if (!hasLength || score < 3) {
        // Weak
        bar1.className = "h-full rounded-full transition-all duration-300 bg-rose-500 shadow-xs";
        label.textContent = "Weak";
        label.className = "font-bold text-rose-500";
        hint.textContent = "Add mixed case, numbers & symbols";
    } else if (score < 5) {
        // Strong
        bar1.className = "h-full rounded-full transition-all duration-300 bg-amber-500 shadow-xs";
        bar2.className = "h-full rounded-full transition-all duration-300 bg-amber-500 shadow-xs";
        label.textContent = "Strong";
        label.className = "font-bold text-amber-500";
        hint.textContent = "Good password! Add symbols for max strength";
    } else {
        // Super Strong
        bar1.className = "h-full rounded-full transition-all duration-300 bg-emerald-500 shadow-xs";
        bar2.className = "h-full rounded-full transition-all duration-300 bg-emerald-500 shadow-xs";
        bar3.className = "h-full rounded-full transition-all duration-300 bg-emerald-500 shadow-xs";
        label.textContent = "Super Strong";
        label.className = "font-bold text-emerald-500";
        hint.textContent = "Excellent! Highly secure password";
    }
}

function updateReqPill(element, isMet) {
    if (!element) return;
    const icon = element.querySelector(".req-icon");
    if (isMet) {
        element.className = "px-2 py-0.5 rounded-md bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20 font-semibold transition-all flex items-center space-x-1";
        if (icon) icon.textContent = "✓";
    } else {
        element.className = "px-2 py-0.5 rounded-md bg-slate-200/70 dark:bg-zinc-800/70 text-slate-500 dark:text-zinc-400 border border-transparent font-medium transition-all flex items-center space-x-1";
        if (icon) icon.textContent = "•";
    }
}

async function handleRegister(e) {
    e.preventDefault();
    const btn = document.getElementById("reg-submit-btn");
    const fullName = document.getElementById("reg-name").value.trim();
    const email = document.getElementById("reg-email").value.trim();
    const password = document.getElementById("reg-password").value;
    const role = document.getElementById("reg-role").value;

    btn.disabled = true;
    btn.textContent = "Creating account...";

    try {
        await window.Nexus.apiFetch("/api/v1/auth/register", {
            method: "POST",
            body: JSON.stringify({ full_name: fullName, email, password, role })
        });
        window.Nexus.showToast("Account created! Logging in...", "success");

        // Auto login
        const loginResp = await window.Nexus.apiFetch("/api/v1/auth/login", {
            method: "POST",
            body: JSON.stringify({ email, password })
        });
        window.Nexus.setToken(loginResp.data.access_token);

        setTimeout(() => {
            if (role === "VENDOR") window.location.href = "/vendor/dashboard";
            else window.location.href = "/customer/dashboard";
        }, 600);
    } catch(err) {
        window.Nexus.showToast(err.message || "Registration failed", "error");
        btn.disabled = false;
        btn.textContent = "Create Account";
    }
}

document.addEventListener("DOMContentLoaded", () => {
    const params = new URLSearchParams(window.location.search);
    if (params.get("role") === "VENDOR") selectRole("VENDOR");
});
</script>
{% endblock %}
