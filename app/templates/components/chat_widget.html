<!-- Floating Real-time Live Chat Widget -->
<div id="chat-widget-container" class="relative">
    <!-- Floating Chat Trigger Button -->
    <button id="chat-widget-btn" onclick="toggleChatWindow()" class="w-14 h-14 rounded-full bg-gradient-to-r from-indigo-500 to-violet-600 text-white flex items-center justify-center shadow-2xl hover:shadow-indigo-500/50 transition-all cursor-pointer focus:outline-none">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path>
        </svg>
        <span id="chat-unread-badge" class="absolute -top-1 -right-1 w-5 h-5 bg-pink-500 text-white text-xs font-bold rounded-full flex items-center justify-center hidden">0</span>
    </button>

    <!-- Chat Modal Window -->
    <div id="chat-window" class="glass-panel border border-slate-700/80 bg-slate-900/95 hidden overflow-hidden">
        <!-- Header -->
        <div class="px-4 py-3 bg-slate-950/80 border-b border-slate-800 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
                <h3 id="chat-header-title" class="font-semibold text-sm text-white">Live Store Chat</h3>
            </div>
            <div class="flex items-center space-x-2">
                <button id="chat-back-btn" onclick="showConversationList()" class="text-xs text-indigo-400 hover:text-indigo-300 hidden">← Back</button>
                <button onclick="toggleChatWindow()" class="text-slate-400 hover:text-white transition-colors">✕</button>
            </div>
        </div>

        <!-- Conversations View (Thread List) -->
        <div id="chat-conversations-view" class="flex-1 overflow-y-auto p-3 space-y-2">
            <p class="text-xs text-slate-400 text-center py-4">Loading your conversations...</p>
        </div>

        <!-- Single Conversation Message Stream View -->
        <div id="chat-messages-view" class="flex-1 overflow-y-auto p-3 space-y-3 hidden flex flex-col">
            <!-- Messages injected dynamically -->
        </div>

        <!-- Message Input Footer -->
        <form id="chat-input-form" onsubmit="handleSendMessage(event)" class="p-3 bg-slate-950/90 border-t border-slate-800 flex items-center space-x-2 hidden">
            <input type="text" id="chat-msg-input" placeholder="Type a message..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
            <button type="submit" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-medium transition-colors">
                Send
            </button>
        </form>
    </div>
</div>

<script>
let currentPeerId = null;
let currentVendorId = null;
let chatSocket = null;

function toggleChatWindow() {
    const win = document.getElementById("chat-window");
    const isHidden = win.classList.contains("hidden");
    if (isHidden) {
        win.classList.remove("hidden");
        initChatSocket();
        loadConversations();
    } else {
        win.classList.add("hidden");
    }
}

function initChatSocket() {
    const token = window.Nexus ? window.Nexus.getToken() : null;
    if (!token) return;
    if (chatSocket && chatSocket.readyState === WebSocket.OPEN) return;

    const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
    chatSocket = new WebSocket(`${protocol}//${window.location.host}/api/v1/chat/ws?token=${token}`);

    chatSocket.onmessage = function(event) {
        try {
            const data = JSON.parse(event.data);
            if (data.type === "new_message") {
                const msg = data.message;
                if (currentPeerId === msg.sender_id) {
                    appendMessageBubble(msg.message, false, msg.created_at);
                    if (window.Nexus) window.Nexus.apiFetch(`/api/v1/chat/read/${msg.sender_id}`, { method: "PUT" });
                } else {
                    updateUnreadBadge();
                }
            } else if (data.type === "ack") {
                // Sender ACK
            }
        } catch(e) { console.error("WS Parse error", e); }
    };
}

async function loadConversations() {
    const view = document.getElementById("chat-conversations-view");
    try {
        const resp = await window.Nexus.apiFetch("/api/v1/chat/conversations");
        const convs = resp.data || [];
        if (convs.length === 0) {
            view.innerHTML = `<p class="text-xs text-slate-400 text-center py-8">No active chat threads.<br>Browse store products to message vendors!</p>`;
            return;
        }
        view.innerHTML = convs.map(c => `
            <div onclick="openChatThread(${c.other_user_id}, '${c.other_user_name}', ${c.vendor_id})" class="p-2.5 rounded-xl bg-slate-800/60 hover:bg-slate-800 border border-slate-700/50 cursor-pointer transition-all flex items-center justify-between">
                <div>
                    <h4 class="text-sm font-medium text-white">${c.other_user_name} ${c.store_name ? `<span class="text-xs text-indigo-400">(${c.store_name})</span>` : ''}</h4>
                    <p class="text-xs text-slate-400 truncate max-w-[200px]">${c.last_message}</p>
                </div>
                ${c.unread_count > 0 ? `<span class="px-2 py-0.5 bg-pink-500 text-white text-xs font-bold rounded-full">${c.unread_count}</span>` : ''}
            </div>
        `).join('');
    } catch(err) {
        view.innerHTML = `<p class="text-xs text-rose-400 text-center py-4">${err.message || 'Please log in to chat.'}</p>`;
    }
}

async function openChatThread(peerId, peerName, vendorId) {
    currentPeerId = peerId;
    currentVendorId = vendorId || peerId;
    document.getElementById("chat-header-title").textContent = peerName;
    document.getElementById("chat-back-btn").classList.remove("hidden");
    document.getElementById("chat-conversations-view").classList.add("hidden");
    document.getElementById("chat-messages-view").classList.remove("hidden");
    document.getElementById("chat-input-form").classList.remove("hidden");

    // Load history
    const stream = document.getElementById("chat-messages-view");
    stream.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">Loading history...</p>`;
    try {
        const resp = await window.Nexus.apiFetch(`/api/v1/chat/history/${peerId}`);
        const messages = resp.data || [];
        stream.innerHTML = "";
        messages.forEach(m => {
            const isMe = m.sender_id !== peerId;
            appendMessageBubble(m.message, isMe, m.created_at);
        });
        stream.scrollTop = stream.scrollHeight;
        // Mark read
        await window.Nexus.apiFetch(`/api/v1/chat/read/${peerId}`, { method: "PUT" });
    } catch(err) {
        stream.innerHTML = `<p class="text-xs text-rose-400 text-center py-4">Error loading messages</p>`;
    }
}

function showConversationList() {
    currentPeerId = null;
    document.getElementById("chat-header-title").textContent = "Live Store Chat";
    document.getElementById("chat-back-btn").classList.add("hidden");
    document.getElementById("chat-conversations-view").classList.remove("hidden");
    document.getElementById("chat-messages-view").classList.add("hidden");
    document.getElementById("chat-input-form").classList.add("hidden");
    loadConversations();
}

function appendMessageBubble(text, isMe, timeStr) {
    const stream = document.getElementById("chat-messages-view");
    const div = document.createElement("div");
    div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
    div.innerHTML = `
        <div class="max-w-[75%] px-3.5 py-2 rounded-2xl text-xs font-normal ${isMe ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-slate-800 text-slate-200 rounded-bl-none'}">
            ${text}
        </div>
    `;
    stream.appendChild(div);
    stream.scrollTop = stream.scrollHeight;
}

async function handleSendMessage(e) {
    e.preventDefault();
    const input = document.getElementById("chat-msg-input");
    const text = input.value.trim();
    if (!text || !currentPeerId) return;

    input.value = "";
    appendMessageBubble(text, true, new Date().toISOString());

    if (chatSocket && chatSocket.readyState === WebSocket.OPEN) {
        chatSocket.send(JSON.stringify({
            receiver_id: currentPeerId,
            vendor_id: currentVendorId,
            message: text
        }));
    } else {
        await window.Nexus.apiFetch("/api/v1/chat/messages", {
            method: "POST",
            body: JSON.stringify({
                receiver_id: currentPeerId,
                vendor_id: currentVendorId,
                message: text
            })
        });
    }
}
</script>
